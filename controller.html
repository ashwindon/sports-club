<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1a12" />
    <title>Bat Controller</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏏</text></svg>" />
  </head>
  <body>
    <!-- Illustrations, drawn once and placed with <use>. Colours are attributes
         rather than CSS so they survive being cloned into each <use>. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <!-- Seen from behind the player: phone upright in both hands, back towards
           you, screen towards the TV. -->
      <symbol id="fig-hold" viewBox="0 0 320 230">
        <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12">
          <rect x="96" y="12" width="128" height="80" rx="6" fill="#26352a" stroke="#4a6650" />
          <rect x="102" y="18" width="116" height="68" rx="2" fill="#9fcbea" />
          <rect x="102" y="54" width="116" height="32" fill="#4a8a3f" />
          <polygon points="153,54 167,54 186,86 134,86" fill="#cdb98a" />
          <path d="M157 47v8M160 47v8M163 47v8" stroke="#f2ead8" stroke-width="1.5" />
          <rect x="153" y="92" width="14" height="10" fill="#26352a" />
          <rect x="134" y="102" width="52" height="5" rx="2" fill="#26352a" />
          <text x="232" y="56" fill="#eef3ea">TV</text>

          <rect x="134" y="118" width="52" height="104" rx="9" fill="#4a4f57" stroke="#646a73" />
          <rect x="140" y="124" width="17" height="28" rx="5" fill="#2b2f35" />
          <circle cx="148.5" cy="131.5" r="4" fill="#0e0f11" stroke="#6b717a" />
          <circle cx="148.5" cy="144" r="4" fill="#0e0f11" stroke="#6b717a" />
          <rect x="122" y="160" width="76" height="24" rx="12" fill="#d9a77f" />
          <rect x="122" y="186" width="76" height="24" rx="12" fill="#c9966f" />
          <path d="M141 165v14M157 165v14M173 165v14M189 165v14M141 191v14M157 191v14M173 191v14M189 191v14" stroke="#a87652" stroke-width="1.5" stroke-linecap="round" />

          <path d="M112 214V132" stroke="#eef3ea" stroke-width="2" />
          <polygon points="112,122 105,134 119,134" fill="#eef3ea" />
          <text x="102" y="138" text-anchor="end" fill="#eef3ea">top edge</text>
          <text x="102" y="153" text-anchor="end" fill="#eef3ea">up</text>

          <path d="M196 140C226 130 236 112 228 98" fill="none" stroke="#e8c547" stroke-width="2.5" stroke-dasharray="6 4" />
          <polygon points="221,91 231.6,94.6 224.6,101.6" fill="#e8c547" />
          <text x="238" y="124" fill="#e8c547" font-weight="600">screen</text>
          <text x="238" y="139" fill="#e8c547" font-weight="600">faces TV</text>
        </g>
      </symbol>

      <!-- Seen from the side: the phone is the handle, the blade hangs below it,
           and the screen is the bat's face, turned towards the TV. -->
      <symbol id="fig-bat" viewBox="0 0 320 270">
        <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12">
          <rect x="0" y="258" width="320" height="12" fill="#132016" />
          <path d="M0 258H320" stroke="#3d5a42" stroke-width="2" />

          <rect x="14" y="62" width="12" height="92" rx="2" fill="#26352a" stroke="#4a6650" />
          <rect x="25" y="66" width="3" height="84" fill="#9fcbea" />
          <rect x="17" y="154" width="6" height="98" fill="#26352a" />
          <rect x="6" y="252" width="28" height="6" rx="2" fill="#26352a" />
          <text x="20" y="54" text-anchor="middle" fill="#eef3ea">TV</text>

          <path d="M143 100V244Q143 252 151 252H158Q167 252 169 241C177 196 177 146 160 106L157 100Z" fill="#d9b77e" />
          <path d="M143 103V246" stroke="#f3dfb5" stroke-width="4" stroke-linecap="round" />
          <rect x="141" y="20" width="13" height="82" rx="3" fill="#4a4f57" stroke="#646a73" />
          <rect x="141" y="24" width="3" height="74" fill="#9fcbea" />
          <ellipse cx="147.5" cy="50" rx="13" ry="9" fill="#d9a77f" />
          <ellipse cx="147.5" cy="71" rx="13" ry="9" fill="#c9966f" />

          <path d="M138 32H112" stroke="#9fb3a2" />
          <text x="108" y="29" text-anchor="end" fill="#eef3ea">screen =</text>
          <text x="108" y="43" text-anchor="end" fill="#eef3ea">bat's face</text>

          <path d="M157 22H182" stroke="#9fb3a2" />
          <text x="186" y="20" fill="#eef3ea">top edge =</text>
          <text x="186" y="34" fill="#eef3ea">top of the handle</text>

          <path d="M162 61H182" stroke="#9fb3a2" />
          <text x="186" y="59" fill="#eef3ea">your phone is</text>
          <text x="186" y="73" fill="#eef3ea">the handle</text>

          <path d="M182 104H188V250H182" fill="none" stroke="#9fb3a2" stroke-width="1.5" />
          <text x="196" y="172" fill="#eef3ea">the blade hangs</text>
          <text x="196" y="186" fill="#eef3ea">below your hands</text>

          <path d="M134 176H46" stroke="#e8c547" stroke-width="2.5" stroke-dasharray="6 4" />
          <polygon points="34,176 46,169 46,183" fill="#e8c547" />
          <text x="88" y="164" text-anchor="middle" fill="#e8c547" font-weight="600" font-size="11">faces the bowler</text>
        </g>
      </symbol>
    </svg>

    <main class="controller">
      <header>
        <h1>Bat controller</h1>
        <p id="link-status" class="status">Connecting to the game…</p>
      </header>

      <section id="start-panel" class="panel">
        <figure class="guide">
          <figcaption><span class="step">1</span>Hold your phone like a bat handle</figcaption>
          <svg class="illustration" viewBox="0 0 320 230" role="img"
            aria-label="Seen from behind you: the phone upright in both hands, top edge up, with its back towards you and its screen facing the TV.">
            <use href="#fig-hold" />
          </svg>
          <p>
            Upright, <strong>top edge up</strong>, gripped in both hands, with the
            <strong>screen facing the TV</strong>. From where you stand, you see the back of the phone.
          </p>
        </figure>

        <figure class="guide">
          <figcaption><span class="step">2</span>Your phone becomes this bat</figcaption>
          <svg class="illustration" viewBox="0 0 320 270" role="img"
            aria-label="Seen from the side: the phone is the bat's handle, the blade hangs straight down below your hands, and the phone's screen is the bat's face, turned towards the bowler on the TV.">
            <use href="#fig-bat" />
          </svg>
          <p>
            The phone is the handle, and the blade hangs straight down below your hands.
            The <strong>screen is the bat's face</strong>, the side you hit with. This is the stance you calibrate in.
          </p>
        </figure>

        <p class="caution">Grip firmly, and give yourself room to swing.</p>
        <button id="start" class="big" type="button">Start</button>
        <p id="start-error" class="error" hidden></p>
      </section>

      <section id="play-panel" class="panel" hidden>
        <button id="calibrate" class="big" type="button">Calibrate</button>
        <figure class="guide compact">
          <svg class="illustration" viewBox="0 0 320 270" role="img"
            aria-label="The stance to calibrate in: phone upright as the bat's handle, screen towards the TV.">
            <use href="#fig-bat" />
          </svg>
          <p>
            Take your stance holding the phone like this, screen towards the TV, then tap
            <strong>Calibrate</strong> (or press <kbd>C</kbd> on the computer). Do it again whenever
            the bat on the TV drifts.
          </p>
        </figure>

        <div id="sim" class="sim" hidden>
          <div id="sim-pad" class="sim-pad">Drag to tilt and turn the pretend phone</div>
          <button id="sim-swing" class="big secondary" type="button">Play a drive (space)</button>
        </div>

        <label class="field" id="source-field">
          Motion from
          <select id="source">
            <option value="browser" selected>Phone's own orientation (recommended)</option>
            <option value="fused">Gyro + accelerometer (ahrs)</option>
          </select>
        </label>

        <dl class="readout">
          <div><dt>Samples</dt><dd id="rate">–</dd></div>
          <div><dt>Spin</dt><dd id="spin">–</dd></div>
          <div><dt>Peak spin</dt><dd id="peak">–</dd></div>
          <div class="wide"><dt>Sensors</dt><dd id="sensors">–</dd></div>
        </dl>
      </section>
    </main>
    <script type="module" src="/src/controller/main.ts"></script>
  </body>
</html>
